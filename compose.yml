name: lasuite

include:
  - interop/compose.yml

services:
  menshen-postgresql-base:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 2s
      retries: 300
    env_file:
      - env.d/development/postgresql
      - env.d/development/postgresql.local
    ports:
      - "49001:5432"
    networks:
      lasuite:
        aliases:
          - postgresql

  menshen-postgresql:
    extends:
        service: menshen-postgresql-base

  menshen-postgresql-pc:
    extends:
        service: menshen-postgresql-base

  menshen-backend-base:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
      target: backend-development
      args:
        DOCKER_USER: ${DOCKER_USER:-1000}
    user: ${DOCKER_USER:-1000}
    image: menshen:backend-development
    environment:
      - DJANGO_CONFIGURATION=Development
    env_file:
      - env.d/development/common
      - env.d/development/common.local
      - env.d/development/postgresql
      - env.d/development/postgresql.local
    healthcheck:
      test: ["CMD-SHELL", "curl localhost:8000/__heartbeat__"]
      interval: 1s
      timeout: 2s
      retries: 30
    ports:
      - "49000:8000"
    networks:
      lasuite:
        aliases:
          - menshen
    volumes:
      - ./src/backend:/app
      - ./data/static:/data/static

  menshen-backend:
    extends:
        service: menshen-backend-base
    depends_on:
      menshen-postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy

  # Use proconnect instead of local keycloak instance
  menshen-backend-pc:
    extends:
      service: menshen-backend-base
    env_file:
      - env.d/development/common
      - env.d/development/common.local
      - env.d/development/postgresql
      - env.d/development/postgresql.local
      - env.d/development/proconnect.local
    depends_on:
      menshen-postgresql-pc:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started

  menshen-backend-e2e:
    extends:
        service: menshen-backend-base
    environment:
      # The Keycloak issuer is set by --hostname=http://keycloak:8080
      # (keycloak-e2e service), it does not depend on the host used to reach
      # the server. OIDC_OP_URL must match it for the introspection claims
      # registry validation (iss) to pass.
      OIDC_OP_URL: http://keycloak:8080/realms/lasuite
    depends_on:
      menshen-postgresql:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
      keycloak-e2e:
        condition: service_healthy


  keycloak-e2e:
    extends:
      service: keycloak
    command:
      - start-dev
      - --features=preview
      - --import-realm
      - --hostname=http://keycloak:8080
      - --hostname-backchannel-dynamic=true
      - --hostname-strict=false
      - --health-enabled=true
      - --metrics-enabled=true

  menshen-playground-source-base:
    build:
      context: .
      dockerfile: ./src/playground/source/Dockerfile
      target: backend-development
    image: menshen:playground-source
    ports:
      - "49002:8000"
    develop:
      watch:
        - action: sync+restart
          path: ./src/playground/source
          target: /app
          ignore:
            - ./src/playground/source/.venv/
        - action: rebuild
          path: ./src/playground/source/uv.lock
        - action: rebuild
          path: ./src/playground/source/Dockerfile
    networks:
      lasuite:
        aliases:
          - menshen-playground-source

  menshen-playground-source:
    extends:
        service: menshen-playground-source-base
    env_file:
      - env.d/development/common
    environment:
      DJANGO_SETTINGS_MODULE: source.settings
    depends_on:
      keycloak:
        condition: service_healthy
      menshen-backend:
        condition: service_healthy

  menshen-playground-source-e2e:
    extends:
        service: menshen-playground-source-base
    env_file:
      - env.d/development/common
    environment:
      DJANGO_SETTINGS_MODULE: source.settings
      OIDC_OP_URL: http://keycloak:8080/realms/lasuite
      PLAYGROUND_SOURCE_SERVICE_NETLOC: menshen-playground-source:8000
    depends_on:
      menshen-backend-e2e:
        condition: service_healthy

  # Use proconnect instead of local keycloak instance
  menshen-playground-source-pc:
    extends:
        service: menshen-playground-source-base
    env_file:
      - env.d/development/proconnect.local
    depends_on:
      menshen-backend-pc:
        condition: service_healthy

  menshen-playground-target-base:
    build:
      context: .
      dockerfile: ./src/playground/target/Dockerfile
      target: backend-development
    image: menshen:playground-target
    ports:
      - "49003:8000"
    develop:
      watch:
        - action: sync+restart
          path: ./src/playground/target
          target: /app
          ignore:
            - ./src/playground/target/.venv/
        - action: rebuild
          path: ./src/playground/target/uv.lock
        - action: rebuild
          path: ./src/playground/target/Dockerfile
    networks:
      lasuite:
        aliases:
          - menshen-playground-target

  menshen-playground-target:
    extends:
        service: menshen-playground-target-base
    env_file:
      - env.d/development/common
    environment:
      DJANGO_SETTINGS_MODULE: target.settings
    depends_on:
      keycloak:
        condition: service_healthy
      menshen-backend:
        condition: service_healthy

  menshen-playground-target-e2e:
    extends:
        service: menshen-playground-target-base
    env_file:
      - env.d/development/common
    environment:
      OIDC_OP_URL: http://keycloak:8080/realms/lasuite
      PLAYGROUND_TARGET_SERVICE_NETLOC: menshen-playground-target:8000
      DJANGO_SETTINGS_MODULE: target.settings
    depends_on:
      menshen-backend-e2e:
        condition: service_healthy

  menshen-playground-target-pc:
    extends:
        service: menshen-playground-target-base
    env_file:
      - env.d/development/proconnect.local
    depends_on:
      menshen-backend-pc:
        condition: service_healthy

  # Utils
  openssl:
    image: alpine/openssl:3.5.8

  playwright:
    build:
      context: .
      dockerfile: ./src/e2e/Dockerfile
      args:
        DOCKER_UID: ${DOCKER_UID:-1000}
    user: ${DOCKER_USER:-1000}
    volumes:
      - ./src/e2e:/app
    ports:
      - "3000:8000"
    networks:
      lasuite:
        aliases:
          - playwright
    depends_on:
      - menshen-playground-source-e2e
      - menshen-playground-target-e2e

volumes:
  venv:
