name: Client Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
    paths:
      - src/client/**

permissions: {}

jobs:

  build-client:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.4"
          enable-cache: true

      - name: Build the project
        run: uv sync --locked --all-extras --dev
        
  lint-client:
    needs: build-client
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.4"
          enable-cache: true

      - name: Check code formatting with ruff
        run: uv run ruff format . --diff

      - name: Lint code with ruff
        run: uv run ruff check .

      - name: Check types with ty
        run: uv run ty check

  test-client:
    needs: build-client
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.4"
          enable-cache: true

      - name: Run tests
        run: uv run pytest
