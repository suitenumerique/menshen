name: Helmfile lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
    paths:
      - src/helm/menshen/**

permissions: {}

jobs:
  helmfile-lint:
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_helmfile-lint.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      environments: dev
      helmfile_version: v1.8.2
