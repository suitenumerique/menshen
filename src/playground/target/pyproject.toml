[project]
name = "target"
version = "0.1.0"
description = "Token exchange playground target service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "django-lasuite>=0.0.25",
    "djangorestframework>=3.17.1",
    "menshen-client>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-responses==0.6.0",
    "responses==0.26.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "target.settings"
python_files = [
    "test_*.py",
    "tests.py",
]
pythonpath = ["."]
